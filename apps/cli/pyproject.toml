[project]
name = "ov-black-cli"
version = "0.1.0"
description = "ovb — operator CLI + e2e harness + generated SDK for the OV Black stack"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.27,<0.28",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "email-validator>=2.2,<3",
    "typer>=0.15,<0.16",
    "rich>=13.9,<14",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "anyio>=4.6,<5",
    "respx>=0.21,<0.22",
    "ruff>=0.15,<0.16",
    "mypy>=1.18,<2",
    "datamodel-code-generator>=0.26,<1",
]

[project.scripts]
ovb = "ovb.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ovb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# e2e tests probe a live target and self-skip when no profile is reachable;
# `-m "not e2e"` runs the fully-offline suite (unit + SSE parsing).
markers = [
    "e2e: exercises a live API target (local or staging); skipped without one",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# The generated SDK models are machine-emitted; never hand-lint them.
extend-exclude = ["src/ovb/_generated"]

[tool.ruff.lint]
# Mirrors apps/api: E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear,
# SIM flake8-simplify, C4 comprehensions. UP042 excluded for the same StrEnum reason.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# Typer builds its option/argument markers in defaults by design (immutable for B008).
extend-immutable-calls = [
    "typer.Option",
    "typer.Argument",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/ovb"]
plugins = ["pydantic.mypy"]
# The generated SDK models are excluded from `files`; this override suppresses
# errors *inside* the machine-emitted module while still letting importers see
# the real model types (no follow_imports=skip, which would flatten them to Any).
[[tool.mypy.overrides]]
module = ["ovb._generated.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["typer.*", "respx.*"]
ignore_missing_imports = true
