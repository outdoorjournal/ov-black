[project]
name = "ov-black-agent"
version = "0.1.0"
description = "Outdoor Voyage: Black — Bedrock AgentCore runtime (Strands Agents)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "bedrock-agentcore>=0.1,<1",
    "bedrock-agentcore-starter-toolkit>=0.1,<1",
    "strands-agents>=0.1,<2",
    "boto3>=1.35,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "respx>=0.21,<1",
    "anyio>=4.6,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
