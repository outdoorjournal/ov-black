[project]
name = "ov-black-api"
version = "0.1.0"
description = "OV Black FastAPI backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0.35,<3",
    "asyncpg>=0.30,<0.31",
    "pyjwt[crypto]>=2.9,<3",
    "httpx>=0.27,<0.28",
    "uvicorn[standard]>=0.32,<0.33",
    "email-validator>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "anyio>=4.6,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
